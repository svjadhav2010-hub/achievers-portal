<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoeShop | Premium Comfort</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --accent-color: #8b5e3c;
            --bg-light: #f4f4f4;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        /* Top Announcement Bar */
        .promo-bar {
            background: var(--accent-color);
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 14px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: var(--white);
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; }

        nav ul { display: flex; list-style: none; gap: 25px; }
        nav a { text-decoration: none; color: var(--primary-color); font-weight: 500; }

        .search-bar {
            background: #eee;
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
        }
        .search-bar input { border: none; background: transparent; outline: none; margin-left: 10px; }

        /* Category Slider */
        .category-section {
            padding: 20px 5%;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 15px;
            scrollbar-width: none;
        }
        .category-card {
            min-width: 100px;
            text-align: center;
            cursor: pointer;
        }
        .category-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #f0f0f0;
            object-fit: cover;
            margin-bottom: 8px;
            transition: transform 0.3s;
        }
        .category-card:hover img { transform: scale(1.1); }

        /* Hero Banner */
        .hero {
            margin: 0 5%;
            height: 500px;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding: 0 50px;
            color: white;
        }
        .hero-content h1 { font-size: 48px; margin-bottom: 15px; text-transform: uppercase; }
        .btn-shop {
            background: var(--white);
            color: var(--primary-color);
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-shop:hover { background: var(--primary-color); color: white; }

        /* Countdown */
        #timer { font-weight: bold; color: #fff; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="promo-bar">
        <span>COMFORT RUSH DEALS END IN: <span id="timer">05d : 03h : 09m : 29s</span></span>
        <span>| BUY 2 GET 10% OFF</span>
    </div>

    <header>
        <div class="logo">Chumbhale's</div>
        <nav>
            <ul>
                <li><a href="#">MEN</a></li>
                <li><a href="#">WOMEN</a></li>
                <li><a href="#">OFFERS</a></li>
            </ul>
        </nav>
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" placeholder="Search Slip Ons...">
        </div>
        <div class="user-tools">
            <span style="margin-right: 15px; cursor: pointer;">👤 Account</span>
            <span style="cursor: pointer;">🛒 Cart (0)</span>
        </div>
    </header>

    <div class="category-section">
        <div class="category-card">
            <img src="https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=150" alt="Sneakers">
            <p>Sneakers</p>
        </div>
        <div class="category-card">
            <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=150" alt="Slip Ons">
            <p>Slip Ons</p>
        </div>
        <div class="category-card">
            <img src="https://images.unsplash.com/photo-1531310197839-ccf54634509e?w=150" alt="Loafers">
            <p>Loafers</p>
        </div>
        <div class="category-card">
            <img src="https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?w=150" alt="Oxfords">
            <p>Oxfords</p>
        </div>
        <div class="category-card">
            <img src="https://images.unsplash.com/photo-1603808033192-082d6919d3e1?w=150" alt="Slides">
            <p>Slides</p>
        </div>
        <div class="category-card">
            <img src="https://images.unsplash.com/photo-1605733513597-a8f8d410fe3c?w=150" alt="Sandals">
            <p>Sandals</p>
        </div>
    </div>

    <section class="hero">
        <div class="hero-content">
            <p>PRESENTING</p>
            <h1>EVERYDAY WILL FEEL <br> LIKE SIGHTSEEING</h1>
            <p style="margin-bottom: 25px;">The All-Day Comfort Walkers</p>
            <a href="#" class="btn-shop">GET YOURS NOW</a>
        </div>
    </section>

    <script>
        // Simple Countdown Timer Logic
        function startTimer(duration, display) {
            let timer = duration, days, hours, minutes, seconds;
            setInterval(function () {
                days = parseInt(timer / (3600*24), 10);
                hours = parseInt((timer % (3600*24)) / 3600, 10);
                minutes = parseInt((timer % 3600) / 60, 10);
                seconds = parseInt(timer % 60, 10);

                display.textContent = `${days}d : ${hours}h : ${minutes}m : ${seconds}s`;

                if (--timer < 0) {
                    timer = duration;
                }
            }, 1000);
        }

        window.onload = function () {
            let fiveDays = 60 * 60 * 24 * 5;
            let display = document.querySelector('#timer');
            startTimer(fiveDays, display);
        };
    </script>

</body>
</html>
